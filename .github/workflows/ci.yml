name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Rebuild better-sqlite3 for Electron ABI
        run: npx electron-rebuild -f -o better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package (NSIS)
        run: npm run dist

      - name: Packaged e2e
        run: node scripts/e2e-dist.mjs --no-build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: crewdeck-installer
          path: release/*.exe
          if-no-files-found: error

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
