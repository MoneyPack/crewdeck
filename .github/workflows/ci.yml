name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  build:
    name: Lint, typecheck, native rebuild, test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install MSVC Spectre-mitigated libraries (MSB8040)
        shell: pwsh
        run: ./scripts/ci/install-spectre-libs.ps1

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Rebuild native modules against Electron
        run: npm run rebuild

      - name: Load native modules inside Electron (ABI check)
        run: npm run smoke

      - run: npm test

  smoke:
    name: Packaged smoke (win-unpacked)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install MSVC Spectre-mitigated libraries (MSB8040)
        shell: pwsh
        run: ./scripts/ci/install-spectre-libs.ps1

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build installer
        run: npm run dist

      - name: Run packaged e2e smoke
        run: npm run test:e2e:dist
        env:
          ZAPFLEET_E2E_EXE: ${{ github.workspace }}\release\win-unpacked\zapfleet.exe

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            release/*.exe
            test-results/
            playwright-report/
            ~/AppData/Roaming/zapfleet/logs/main.log
