name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  build:
    name: Lint, typecheck, native rebuild, test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install MSVC Spectre-mitigated libraries (MSB8040)
        shell: pwsh
        run: ./scripts/ci/install-spectre-libs.ps1

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Rebuild native modules against Electron
        run: npm run rebuild

      - name: Load native modules inside Electron (ABI check)
        run: npm run smoke

      - run: npm test

  smoke:
    name: Packaged smoke (win-unpacked)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install MSVC Spectre-mitigated libraries (MSB8040)
        shell: pwsh
        run: ./scripts/ci/install-spectre-libs.ps1

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build installer
        run: npm run dist

      - name: Run packaged e2e smoke
        run: npm run test:e2e:dist -- --no-build
        env:
          ZAPFLEET_E2E_EXE: ${{ github.workspace }}\release\win-unpacked\zapfleet.exe

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-failure-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            release/*.exe
            test-results/
            playwright-report/
            ~/AppData/Roaming/zapfleet/logs/main.log

  # Tag-only job: builds the NSIS installer, signs it when Azure secrets are
  # set, and publishes it to the GitHub release.
  release:
    name: Publish release (${{ github.ref_name }})
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      NODE_VERSION: '26'
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: ./scripts/ci/install-spectre-libs.ps1
      - run: npm ci
      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder --win --x64 --publish always
