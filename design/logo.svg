<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title desc">
  <title id="title">CrewDeck</title>
  <desc id="desc">A rounded deck tile holding an open letter C. Three crew members sit on the arc: orange, lime and cyan.</desc>
  <defs>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16160f"/>
      <stop offset="1" stop-color="#0c0c0a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#deck)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <!-- The C: an open arc, mouth facing the work -->
  <path d="M88.04 39.96 A34 34 0 1 0 88.04 88.04" fill="none" stroke="#f4f1ea" stroke-opacity="0.92" stroke-width="11" stroke-linecap="round"/>
  <!-- The crew -->
  <g stroke="#0c0c0a" stroke-width="4">
    <circle cx="64" cy="30" r="9" fill="#ff4d00"/>
    <circle cx="30" cy="64" r="9" fill="#c6f432"/>
    <circle cx="64" cy="98" r="9" fill="#3fe0ff"/>
  </g>
  <!-- The prompt the crew is facing -->
  <rect x="84" y="60" width="16" height="8" rx="4" fill="#ff4d00"/>
</svg>
