<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-labelledby="title desc">
  <title id="title">zapfleet</title>
  <desc id="desc">zapfleet: a fleet of coding agents side by side. Claude, Codex and Gemini lanes.</desc>
  <style>
    .lane { stroke-dasharray: 140; stroke-dashoffset: 140; animation: run 1.2s cubic-bezier(.7,0,.2,1) forwards; }
    .l1 { animation-delay: .1s; }
    .l2 { animation-delay: .2s; }
    .l3 { animation-delay: .3s; }
    .arm { transform-origin: 722px 102px; animation: wave 2.4s ease-in-out infinite; }
    .eyes { transform-origin: 675px 100px; animation: blink 3s steps(1) infinite; }
    .scan { animation: scan 3s linear infinite; }
    @keyframes run { to { stroke-dashoffset: 0; } }
    @keyframes wave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(220px); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; stroke-dashoffset: 0 !important; }
    }
  </style>
  <rect width="800" height="220" rx="14" fill="#0c0c0a"/>
  <rect x="1" y="1" width="798" height="218" rx="13" fill="none" stroke="#2a2a22" stroke-width="2"/>
  <rect class="scan" x="0" y="0" width="800" height="2" fill="#c6f432" opacity=".08"/>

  <text x="40" y="96" font-family="Archivo, Inter, 'Segoe UI', sans-serif" font-weight="800" font-size="72" letter-spacing="4" fill="#f4f1ea"><tspan fill="#c6f432">ZAP</tspan>FLEET</text>
  <text x="42" y="126" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" letter-spacing="4" fill="#e8e4da" opacity=".75">A FLEET OF CODING AGENTS, SIDE BY SIDE. ONE WINDOWS APP.</text>

  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" letter-spacing="2">
    <text x="42" y="162" fill="#ff4d00">CLAUDE</text>
    <text x="42" y="182" fill="#c6f432">CODEX</text>
    <text x="42" y="202" fill="#e8e4da">GEMINI</text>
  </g>
  <line class="lane l1" x1="120" y1="158" x2="260" y2="158" stroke="#ff4d00" stroke-width="3" stroke-linecap="round"/>
  <line class="lane l2" x1="120" y1="178" x2="260" y2="178" stroke="#c6f432" stroke-width="3" stroke-linecap="round"/>
  <line class="lane l3" x1="120" y1="198" x2="260" y2="198" stroke="#e8e4da" stroke-width="3" stroke-linecap="round"/>

  <g>
    <rect x="640" y="70" width="90" height="62" rx="14" fill="#16160f" stroke="#2a2a22" stroke-width="2"/>
    <g class="eyes">
      <circle cx="662" cy="100" r="5" fill="#ff4d00"/>
      <circle cx="690" cy="100" r="5" fill="#ff4d00"/>
    </g>
    <path d="M664 116 Q676 122 688 116" stroke="#c6f432" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="676" y1="70" x2="676" y2="54" stroke="#e8e4da" stroke-width="2"/>
    <polygon points="679,46 671,56 676,56 673,62 682,52 677,52" fill="#c6f432"/>
    <g class="arm">
      <rect x="722" y="96" width="12" height="30" rx="5" fill="#2a2a22"/>
      <circle cx="728" cy="94" r="5" fill="#c6f432"/>
    </g>
  </g>
</svg>
