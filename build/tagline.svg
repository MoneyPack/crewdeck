<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 48" width="800" height="48" role="img" aria-label="claude, codex, gemini, your agent, shell: zap them side by side">
  <defs>
    <clipPath id="type">
      <rect x="0" y="0" width="0" height="48">
        <animate attributeName="width" values="0;800;800;0" keyTimes="0;.45;.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="800" height="48" rx="10" fill="#0c0c0a"/>
  <text x="400" y="30" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="17" fill="#c6f432" clip-path="url(#type)">&gt; claude &#183; codex &#183; gemini &#183; your agent &#183; shell - zap them side by side</text>
</svg>
